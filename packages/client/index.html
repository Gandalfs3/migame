<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RPG Cooperativo WLAN</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f8fafc;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* HUD Overlay Maestro */
    .hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    /* Fila Superior (Top Bar) */
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: auto;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
      margin-right: 52px; /* Espacio para el engranaje ⚙️ */
    }

    .badge-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 8px 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      display: none; /* Oculto por defecto para limpiar la UX */
    }

    .status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 6px;
      animation: pulse 1.5s infinite;
    }
    .status-indicator.connected {
      background: #10b981;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .lan-banner {
      background: linear-gradient(135deg, rgba(30, 58, 138, 0.88), rgba(15, 23, 42, 0.88));
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-radius: 12px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }
    .lan-url {
      font-family: monospace;
      font-weight: bold;
      color: #60a5fa;
      background: rgba(0, 0, 0, 0.3);
      padding: 3px 8px;
      border-radius: 6px;
    }
    .btn-copy {
      background: #2563eb;
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-copy:hover {
      background: #1d4ed8;
    }

    /* Panel Central de Controles Descartable */
    .controls-panel {
      pointer-events: auto;
      align-self: center;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 12px;
      color: #cbd5e1;
      display: none; /* Oculto por defecto para UX limpia */
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }
    .key-badge {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      padding: 2px 6px;
      font-weight: bold;
      color: #fff;
    }
    .btn-dismiss-controls {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 14px;
      margin-left: 6px;
    }

    /* D-pad táctil para móviles / tablets */
    .mobile-dpad {
      pointer-events: auto;
      position: absolute;
      bottom: 24px;
      left: 24px;
      width: 140px;
      height: 140px;
      display: none;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      opacity: 0.85;
      z-index: 25;
    }
    .dpad-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f1f5f9;
      font-size: 18px;
      touch-action: none;
    }
    .dpad-btn:active, .dpad-btn.active {
      background: #3b82f6;
      border-color: #60a5fa;
    }
    .dpad-up { grid-column: 2; grid-row: 1; }
    .dpad-left { grid-column: 1; grid-row: 2; }
    .dpad-center { grid-column: 2; grid-row: 2; background: transparent; border: none; }
    .dpad-right { grid-column: 3; grid-row: 2; }
    .dpad-down { grid-column: 2; grid-row: 3; }

    /* ====================================================
       BARRA DE ACCIÓN (PODERES) & VITALES DEL JUGADOR
       ==================================================== */
    .action-bar {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: row;
      gap: 10px;
      pointer-events: auto;
      z-index: 25;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .skill-slot {
      width: 64px;
      height: 64px;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(6px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      transition: transform 0.1s, border-color 0.1s, box-shadow 0.15s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .skill-slot:hover {
      border-color: rgba(255, 255, 255, 0.45);
      transform: translateY(-2px);
    }

    .skill-slot:active {
      transform: scale(0.94);
    }

    .skill-slot .spell-icon {
      font-size: 26px;
      margin-bottom: 6px;
      line-height: 1;
    }

    .skill-slot .spell-key-badge {
      position: absolute;
      top: 4px;
      left: 6px;
      font-size: 11px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.55);
      padding: 1px 5px;
      border-radius: 4px;
      color: #cbd5e1;
    }

    .player-vitals-card {
      position: absolute;
      bottom: 96px;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      z-index: 24;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ====================================================
       LAYOUT MÓVIL / TÁCTIL / PULGAR ERGONÓMICO (AUTO)
       ==================================================== */
    @media (max-width: 768px), (pointer: coarse) and (max-width: 1024px), (max-height: 520px) {
      /* Mover los poderes a la derecha para el pulgar */
      .action-bar {
        bottom: 22px;
        right: 22px;
        left: auto;
        transform: none;
        display: grid;
        grid-template-columns: repeat(2, 60px);
        grid-template-rows: repeat(2, 60px);
        gap: 10px;
        align-items: end;
        justify-items: end;
      }

      /* Poder 1: Principal (más grande, posición base del pulgar) */
      .action-bar .skill-slot-1 {
        grid-column: 2;
        grid-row: 2;
        width: 66px;
        height: 66px;
        border-radius: 18px;
        border-color: rgba(56, 189, 248, 0.8);
        background: rgba(15, 23, 42, 0.95);
        box-shadow: 0 0 16px rgba(56, 189, 248, 0.45);
      }
      .action-bar .skill-slot-1 .spell-icon {
        font-size: 28px;
        margin-bottom: 6px;
      }

      /* Poder 2: Secundario (a la izquierda del pulgar) */
      .action-bar .skill-slot-2 {
        grid-column: 1;
        grid-row: 2;
        width: 54px;
        height: 54px;
        border-radius: 14px;
      }
      .action-bar .skill-slot-2 .spell-icon {
        font-size: 22px;
        margin-bottom: 4px;
      }

      /* Poder 3: Especial / AOE (arriba del pulgar) */
      .action-bar .skill-slot-3 {
        grid-column: 2;
        grid-row: 1;
        width: 54px;
        height: 54px;
        border-radius: 14px;
      }
      .action-bar .skill-slot-3 .spell-icon {
        font-size: 22px;
        margin-bottom: 4px;
      }

      /* Cruceta táctil ajustada a la izquierda */
      .mobile-dpad {
        bottom: 22px;
        left: 20px;
        width: 130px;
        height: 130px;
        gap: 4px;
      }

      /* Vitales compactos en la parte inferior central */
      .player-vitals-card {
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        width: 210px;
        padding: 6px 10px;
        font-size: 11px;
      }

      /* Elementos superiores más compactos */
      .lan-banner {
        padding: 4px 8px;
        font-size: 11px;
        gap: 6px;
      }
      .lan-url {
        font-size: 10px;
        padding: 2px 5px;
      }
      .btn-copy {
        padding: 2px 6px;
        font-size: 10px;
      }

      .class-selector-card {
        padding: 3px 5px;
        gap: 4px;
      }
      .class-selector-card button {
        padding: 4px 8px !important;
        font-size: 11px !important;
      }
    }

    /* Teléfonos en modo vertical (Portrait) */
    @media (max-width: 520px) and (orientation: portrait) {
      .player-vitals-card {
        top: 66px;
        bottom: auto;
        left: 16px;
        transform: none;
        width: 200px;
      }
    }

    /* Clases explícitas para sobrescribir desde el menú de Ajustes ⚙️ */
    body.layout-powers-right .action-bar {
      bottom: 22px !important;
      right: 22px !important;
      left: auto !important;
      transform: none !important;
      display: grid !important;
      grid-template-columns: repeat(2, 60px) !important;
      grid-template-rows: repeat(2, 60px) !important;
      gap: 10px !important;
      align-items: end !important;
      justify-items: end !important;
    }
    body.layout-powers-right .action-bar .skill-slot-1 {
      grid-column: 2 !important;
      grid-row: 2 !important;
      width: 66px !important;
      height: 66px !important;
      border-radius: 18px !important;
      border-color: rgba(56, 189, 248, 0.8) !important;
      background: rgba(15, 23, 42, 0.95) !important;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.45) !important;
    }
    body.layout-powers-right .action-bar .skill-slot-2 {
      grid-column: 1 !important;
      grid-row: 2 !important;
      width: 54px !important;
      height: 54px !important;
      border-radius: 14px !important;
    }
    body.layout-powers-right .action-bar .skill-slot-3 {
      grid-column: 2 !important;
      grid-row: 1 !important;
      width: 54px !important;
      height: 54px !important;
      border-radius: 14px !important;
    }
    body.layout-powers-right .player-vitals-card {
      bottom: 16px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      width: 210px !important;
      padding: 6px 10px !important;
    }

    body.layout-powers-center .action-bar {
      bottom: 16px !important;
      left: 50% !important;
      right: auto !important;
      transform: translateX(-50%) !important;
      display: flex !important;
      flex-direction: row !important;
      gap: 10px !important;
    }
    body.layout-powers-center .action-bar .skill-slot {
      width: 64px !important;
      height: 64px !important;
    }
    body.layout-powers-center .player-vitals-card {
      bottom: 96px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      width: 280px !important;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-overlay">
    <!-- Top Bar -->
    <div class="hud-header">
      <div class="header-left">
        <!-- El selector de clases se inserta limpiamente aquí -->
        <div id="class-selector-slot"></div>

        <!-- Tarjeta de estado de red (activable desde ⚙️ ajustes) -->
        <div class="badge-card" id="badge-card-container">
          <div style="font-weight: 700; font-size: 13px; color: #e2e8f0; display: flex; align-items: center; margin-bottom: 2px;">
            <span class="status-indicator" id="status-dot"></span>
            <span id="status-text">Conectando...</span>
          </div>
          <div style="font-size: 11px; color: #94a3b8;" id="player-id-text">ID: Asignando...</div>
          <div style="font-size: 11px; color: #94a3b8;" id="ping-text">Jugadores: 1 | Latencia: -- ms</div>
        </div>
      </div>

      <div class="header-right">
        <!-- Banner Wi-Fi para unirse -->
        <div class="lan-banner" id="lan-banner">
          <div>
            <span>🌐 Wi-Fi:</span>
            <span class="lan-url" id="lan-url">Cargando...</span>
          </div>
          <button class="btn-copy" id="btn-copy">Copiar</button>
        </div>
      </div>
    </div>

    <!-- Guía de Controles (Activables desde ajustes o cerrables con X) -->
    <div class="controls-panel" id="controls-panel">
      <div>🎮 Moverse: <span class="key-badge">W</span> <span class="key-badge">A</span> <span class="key-badge">S</span> <span class="key-badge">D</span> o Flechas | 📱 Cruceta táctil</div>
      <button class="btn-dismiss-controls" id="btn-dismiss-controls" title="Ocultar guía">✕</button>
    </div>

    <!-- D-Pad Táctil para Dispositivos Móviles -->
    <div class="mobile-dpad" id="mobile-dpad">
      <button class="dpad-btn dpad-up" id="btn-up">▲</button>
      <button class="dpad-btn dpad-left" id="btn-left">◀</button>
      <div class="dpad-center"></div>
      <button class="dpad-btn dpad-right" id="btn-right">▶</button>
      <button class="dpad-btn dpad-down" id="btn-down">▼</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
