<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RPG Cooperativo WLAN - Demo Multijugador</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f8fafc;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    /* HUD Overlay */
    .hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .badge-card {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 6px;
      animation: pulse 1.5s infinite;
    }
    .status-indicator.connected {
      background: #10b981;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .title {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.5px;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 12px;
      color: #94a3b8;
    }
    .lan-banner {
      pointer-events: auto;
      background: linear-gradient(135deg, rgba(30, 58, 138, 0.9), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 12px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.25);
    }
    .lan-url {
      font-family: monospace;
      font-weight: bold;
      color: #60a5fa;
      background: rgba(0, 0, 0, 0.3);
      padding: 3px 8px;
      border-radius: 6px;
    }
    .btn-copy {
      background: #2563eb;
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-copy:hover {
      background: #1d4ed8;
    }
    /* Controles en Pantalla / Instrucciones */
    .controls-panel {
      pointer-events: auto;
      align-self: center;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 12px;
      color: #cbd5e1;
      display: flex;
      gap: 16px;
    }
    .key-badge {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      padding: 2px 6px;
      font-weight: bold;
      color: #fff;
    }
    /* D-pad táctil para móviles / tablets */
    .mobile-dpad {
      pointer-events: auto;
      position: absolute;
      bottom: 24px;
      left: 24px;
      width: 140px;
      height: 140px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      opacity: 0.85;
    }
    .dpad-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f1f5f9;
      font-size: 18px;
      touch-action: none;
    }
    .dpad-btn:active, .dpad-btn.active {
      background: #3b82f6;
      border-color: #60a5fa;
    }
    .dpad-up { grid-column: 2; grid-row: 1; }
    .dpad-left { grid-column: 1; grid-row: 2; }
    .dpad-center { grid-column: 2; grid-row: 2; background: transparent; border: none; }
    .dpad-right { grid-column: 3; grid-row: 2; }
    .dpad-down { grid-column: 2; grid-row: 3; }

    @media (min-width: 1024px) {
      .mobile-dpad {
        display: none; /* Ocultar en pantallas grandes si se usa teclado */
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- DOM Overlay / HUD -->
  <div class="hud-overlay">
    <div class="hud-header">
      <div class="badge-card">
        <div class="title">
          <span class="status-indicator" id="status-dot"></span>
          <span id="status-text">Conectando al servidor...</span>
        </div>
        <div class="subtitle" id="player-id-text">ID: Asignando...</div>
        <div class="subtitle" id="ping-text" style="margin-top: 2px;">Jugadores en línea: 1 | Ping: -- ms</div>
      </div>

      <div class="lan-banner" id="lan-banner">
        <div>
          <span>🌐 Unirse en Wi-Fi:</span>
          <span class="lan-url" id="lan-url">Detectando...</span>
        </div>
        <button class="btn-copy" id="btn-copy">Copiar</button>
      </div>
    </div>

    <!-- Controles -->
    <div class="controls-panel">
      <div>🎮 Moverse: <span class="key-badge">W</span> <span class="key-badge">A</span> <span class="key-badge">S</span> <span class="key-badge">D</span> o Flechas</div>
      <div>📱 En Móvil/Tablet: Usa la cruceta táctil</div>
    </div>

    <!-- D-Pad Táctil para Dispositivos Móviles -->
    <div class="mobile-dpad" id="mobile-dpad">
      <button class="dpad-btn dpad-up" id="btn-up">▲</button>
      <button class="dpad-btn dpad-left" id="btn-left">◀</button>
      <div class="dpad-center"></div>
      <button class="dpad-btn dpad-right" id="btn-right">▶</button>
      <button class="dpad-btn dpad-down" id="btn-down">▼</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    // 1. Inicialización de Three.js y Escena
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#090d16');
    scene.fog = new THREE.FogExp2('#090d16', 0.025);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Luces
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfffaed, 1.2);
    dirLight.position.set(25, 40, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    // Suelo y Cuadrícula
    const groundGeo = new THREE.PlaneGeometry(60, 60);
    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x111827,
      roughness: 0.85,
      metalness: 0.1
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(50, 50, 0x3b82f6, 0x1e293b);
    grid.position.y = 0.01;
    scene.add(grid);

    // Anillo límite del mapa
    const borderGeo = new THREE.RingGeometry(23.8, 24.2, 64);
    const borderMat = new THREE.MeshBasicMaterial({ color: 0xef4444, side: THREE.DoubleSide });
    const borderRing = new THREE.Mesh(borderGeo, borderMat);
    borderRing.rotation.x = -Math.PI / 2;
    borderRing.position.y = 0.02;
    scene.add(borderRing);

    // 2. Gestión de Entidades (Jugadores e Interpolación)
    let myPlayerId = null;
    const playerMeshes = new Map(); // id -> { group, targetX, targetZ, targetRot, bodyMesh }

    function createPlayerMesh(id, colorHex, isLocal) {
      const group = new THREE.Group();

      // Base / Sombra suave en el suelo
      const shadowGeo = new THREE.CircleGeometry(0.7, 32);
      const shadowMat = new THREE.MeshBasicMaterial({
        color: isLocal ? 0x38bdf8 : 0x000000,
        transparent: true,
        opacity: isLocal ? 0.6 : 0.45
      });
      const shadow = new THREE.Mesh(shadowGeo, shadowMat);
      shadow.rotation.x = -Math.PI / 2;
      shadow.position.y = 0.03;
      group.add(shadow);

      // Cuerpo del personaje (Cápsula estilizada)
      const bodyGeo = new THREE.CapsuleGeometry(0.5, 0.8, 8, 16);
      const bodyMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(colorHex),
        roughness: 0.3,
        metalness: 0.2
      });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.9;
      body.castShadow = true;
      group.add(body);

      // Visor / Indicador de dirección frontal
      const visorGeo = new THREE.BoxGeometry(0.35, 0.2, 0.3);
      const visorMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const visor = new THREE.Mesh(visorGeo, visorMat);
      visor.position.set(0, 1.15, 0.4);
      group.add(visor);

      scene.add(group);
      return { group, targetX: 0, targetZ: 0, targetRot: 0, isLocal };
    }

    // 3. Conexión WebSocket Dinámica (LAN-Friendly)
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}`;
    const socket = new WebSocket(wsUrl);

    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const playerIdText = document.getElementById('player-id-text');
    const pingText = document.getElementById('ping-text');
    const lanUrlSpan = document.getElementById('lan-url');
    const btnCopy = document.getElementById('btn-copy');

    socket.onopen = () => {
      statusDot.classList.add('connected');
      statusText.textContent = 'Conectado al Servidor';
      startPingLoop();
    };

    socket.onclose = () => {
      statusDot.classList.remove('connected');
      statusText.textContent = 'Desconectado';
    };

    socket.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        handleServerMessage(msg);
      } catch (err) {
        console.error('Error parseando mensaje:', err);
      }
    };

    function handleServerMessage(msg) {
      if (msg.type === 'welcome') {
        myPlayerId = msg.playerId;
        playerIdText.textContent = `Tu ID: ${myPlayerId}`;
        const lanUrl = `http://${msg.hostIp}:${msg.port}`;
        lanUrlSpan.textContent = lanUrl;
        btnCopy.onclick = () => {
          navigator.clipboard.writeText(lanUrl);
          btnCopy.textContent = '¡Copiado!';
          setTimeout(() => btnCopy.textContent = 'Copiar', 2000);
        };
      } else if (msg.type === 'world_state') {
        pingText.textContent = `Jugadores en línea: ${msg.players.length} | Latencia: ${lastPing} ms`;

        const activeIds = new Set();
        for (const p of msg.players) {
          activeIds.add(p.id);
          let entity = playerMeshes.get(p.id);
          if (!entity) {
            entity = createPlayerMesh(p.id, p.color, p.id === myPlayerId);
            entity.group.position.set(p.x, 0, p.z);
            entity.group.rotation.y = p.rotation;
            playerMeshes.set(p.id, entity);
          }
          // Asignar objetivo para interpolación lineal (Lerp)
          entity.targetX = p.x;
          entity.targetZ = p.z;
          entity.targetRot = p.rotation;
        }

        // Eliminar mallas de jugadores desconectados
        for (const [id, entity] of playerMeshes.entries()) {
          if (!activeIds.has(id)) {
            scene.remove(entity.group);
            playerMeshes.delete(id);
          }
        }
      } else if (msg.type === 'pong') {
        lastPing = Math.round(performance.now() - msg.clientTime);
      }
    }

    // Ping / Latencia
    let lastPing = 0;
    function startPingLoop() {
      setInterval(() => {
        if (socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: 'ping', clientTime: performance.now() }));
        }
      }, 2000);
    }

    // 4. Captura de Inputs (Teclado y Táctil)
    const inputs = { up: false, down: false, left: false, right: false };
    let inputsChanged = false;

    function sendInputs() {
      if (socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
          type: 'input',
          up: inputs.up,
          down: inputs.down,
          left: inputs.left,
          right: inputs.right
        }));
      }
    }

    window.addEventListener('keydown', (e) => {
      let changed = false;
      if (e.code === 'KeyW' || e.code === 'ArrowUp') { inputs.up = true; changed = true; }
      if (e.code === 'KeyS' || e.code === 'ArrowDown') { inputs.down = true; changed = true; }
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') { inputs.left = true; changed = true; }
      if (e.code === 'KeyD' || e.code === 'ArrowRight') { inputs.right = true; changed = true; }
      if (changed) sendInputs();
    });

    window.addEventListener('keyup', (e) => {
      let changed = false;
      if (e.code === 'KeyW' || e.code === 'ArrowUp') { inputs.up = false; changed = true; }
      if (e.code === 'KeyS' || e.code === 'ArrowDown') { inputs.down = false; changed = true; }
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') { inputs.left = false; changed = true; }
      if (e.code === 'KeyD' || e.code === 'ArrowRight') { inputs.right = false; changed = true; }
      if (changed) sendInputs();
    });

    // Soporte táctil en pantalla
    function setupTouchButton(btnId, direction) {
      const btn = document.getElementById(btnId);
      if (!btn) return;
      const start = (e) => {
        e.preventDefault();
        inputs[direction] = true;
        btn.classList.add('active');
        sendInputs();
      };
      const end = (e) => {
        e.preventDefault();
        inputs[direction] = false;
        btn.classList.remove('active');
        sendInputs();
      };
      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', end, { passive: false });
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
      btn.addEventListener('mouseleave', end);
    }

    setupTouchButton('btn-up', 'up');
    setupTouchButton('btn-down', 'down');
    setupTouchButton('btn-left', 'left');
    setupTouchButton('btn-right', 'right');

    // 5. Bucle de Renderizado a 60 FPS con Interpolación Lineal (Lerp)
    const CAMERA_OFFSET = new THREE.Vector3(14, 18, 14); // Ángulo isométrico clásico a ~45 grados

    function animate() {
      requestAnimationFrame(animate);

      // Interpolar posición y rotación de todas las entidades
      for (const entity of playerMeshes.values()) {
        entity.group.position.x += (entity.targetX - entity.group.position.x) * 0.25;
        entity.group.position.z += (entity.targetZ - entity.group.position.z) * 0.25;

        // Rotación más corta
        let diffRot = entity.targetRot - entity.group.rotation.y;
        while (diffRot < -Math.PI) diffRot += Math.PI * 2;
        while (diffRot > Math.PI) diffRot -= Math.PI * 2;
        entity.group.rotation.y += diffRot * 0.3;
      }

      // Cámara suave siguiendo al jugador local
      if (myPlayerId && playerMeshes.has(myPlayerId)) {
        const myEntity = playerMeshes.get(myPlayerId);
        const targetCamX = myEntity.group.position.x + CAMERA_OFFSET.x;
        const targetCamY = CAMERA_OFFSET.y;
        const targetCamZ = myEntity.group.position.z + CAMERA_OFFSET.z;

        camera.position.x += (targetCamX - camera.position.x) * 0.1;
        camera.position.y += (targetCamY - camera.position.y) * 0.1;
        camera.position.z += (targetCamZ - camera.position.z) * 0.1;

        camera.lookAt(myEntity.group.position.x, 1, myEntity.group.position.z);
      } else {
        camera.position.set(CAMERA_OFFSET.x, CAMERA_OFFSET.y, CAMERA_OFFSET.z);
        camera.lookAt(0, 0, 0);
      }

      renderer.render(scene, camera);
    }

    animate();

    // Redimensionado de ventana responsivo
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
